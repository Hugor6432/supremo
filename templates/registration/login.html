{% extends 'base.html' %}

{% block titulo %}Entrar · Reserva de Salas{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🔐 Entrar</h4>
            </div>
            <div class="card-body">
                {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha incorretos.</div>
                {% endif %}
                {% if next and user.is_authenticated %}
                <div class="alert alert-warning">Você não tem acesso a esta página.</div>
                {% endif %}
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

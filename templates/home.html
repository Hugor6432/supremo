{% extends 'base.html' %}

{% block conteudo %}
<div class="text-center py-5">
    <h1>👋 Bem-vindo ao Sistema de Reserva de Salas!</h1>
    <p class="lead text-muted mt-2">Gerencie salas e reservas de forma simples e intuitiva</p>
    
    <div class="row mt-5">
        <div class="col-md-6 mb-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body py-5">
                    <h2 class="mb-3">📍 Salas</h2>
                    <p class="text-muted">Gerencie e configure as salas disponíveis</p>
                    <a href="{% url 'lista_salas' %}" class="btn btn-primary btn-lg mt-3">Acessar Salas</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body py-5">
                    <h2 class="mb-3">📅 Reservas</h2>
                    <p class="text-muted">Crie e gerencie suas reservas</p>
                    <a href="{% url 'lista_reservas' %}" class="btn btn-success btn-lg mt-3">Acessar Reservas</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block conteudo %}
<div class="page-head">
    <h1><span class="ico-titulo">{% include "icones/mais.html" %}</span>Criar Nova Reserva</h1>
</div>
<div class="row">
    <div class="col-lg-9 col-xl-8">
        <form method="post" class="painel">
            {% csrf_token %}
            <div class="painel-titulo">{% include "icones/calendario.html" %} Dados da reserva</div>
            {% include "salas/_campos_reserva.html" %}
            {% include "salas/_campos_repeticao.html" %}
            <div class="rodape-form">
                <button type="submit" class="btn btn-success btn-lg">{% include "icones/check.html" %}Criar Reserva</button>
                <a href="{% url 'lista_reservas' %}" class="btn btn-secondary btn-lg">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

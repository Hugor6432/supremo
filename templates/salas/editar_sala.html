{% extends 'base.html' %}

{% block conteudo %}
<div class="page-head">
    <h1><span class="ico-titulo">{% include "icones/editar.html" %}</span>Editar Sala: {{ sala.nome }}</h1>
</div>
<form method="post" novalidate>
    {% csrf_token %}
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="painel h-100">{% include "salas/_campos_sala.html" %}</div>
        </div>
        <div class="col-lg-6">
            <div class="painel h-100">{% include "salas/_recursos_formset.html" %}</div>
        </div>
    </div>
    <div class="barra-acoes mt-4">
        <button type="submit" class="btn btn-success btn-lg">{% include "icones/salvar.html" %}Salvar Alterações</button>
        <a href="{% url 'lista_salas' %}" class="btn btn-secondary btn-lg">Cancelar</a>
    </div>
</form>
{% endblock %}

{% extends 'base.html' %}

{% block conteudo %}
<h1>Deletar Sala</h1>
<div class="alert alert-danger mt-4">
    <h4>Tem certeza que deseja deletar a sala "{{ sala.nome }}"?</h4>
    <p>Esta ação não pode ser desfeita!</p>
</div>
<div class="row mt-4">
    <div class="col-md-6">
        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex">
                <button type="submit" class="btn btn-danger">Sim, deletar</button>
                <a href="{% url 'lista_salas' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

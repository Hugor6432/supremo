{% extends 'base.html' %}

{% block conteudo %}
<div class="page-head">
    <h1><span class="ico-titulo perigo">{% include "icones/lixeira.html" %}</span>Deletar Sala</h1>
</div>
<div class="painel confirma">
    <div class="alert alert-danger mb-0">
        {% include "icones/alerta.html" %}
        <div>
            <h5 class="mb-1">Tem certeza que deseja deletar a sala "{{ sala.nome }}"?</h5>
            <div>A sala some do site. O administrador pode restaurá-la pelo Admin.</div>
        </div>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="rodape-form">
            <button type="submit" class="btn btn-danger">{% include "icones/lixeira.html" %}Sim, deletar</button>
            <a href="{% url 'lista_salas' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
